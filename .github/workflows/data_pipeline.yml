---
name: data_pipeline

on:
  push: # the tests of uszipcode/data/ on the dev-jcw591 branches only
    branches: ["dev-jcw591*"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pytest"
        run: python -m pip install pytest
      - name: "Run the offline tests"
        run: python -m pytest tests/data -q
