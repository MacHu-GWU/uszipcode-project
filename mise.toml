# Tasks of the uszipcode 3.0 data pipeline (code: uszipcode/data/, downloads and outputs: data_pipeline/).
# Run them from anywhere in the repo:
#   mise run pipeline-check          check the Field catalog, the claims and these tasks
#   mise run crawler-<name>          re-run one crawler (cached download; add -- --refresh to download again)
#   mise run pipeline-build          build the database for the demo PK set (add -- --pk-set full for all ZIPs)
# Every crawler registered in uszipcode/data/crawlers/__init__.py needs a crawler-<name> task below;
# `mise run pipeline-check` fails and prints the block to add when one is missing.
# First time in a clone: `mise trust`, `mise install`, `mise run pipeline-setup`.

[tools]
python = "3.12"

[env]
PYTHONUTF8 = "1"

[tasks.pipeline-setup]
description = "Install pytest into the Python of this project (needed once, for pipeline-test)"
run = "python -m pip install pytest"

[tasks.zipcode-universe]
description = "Build the primary-key list of every ZIP code (data_pipeline/output/zipcode_universe.csv)"
run = "python -m uszipcode.data.zipcode_universe"

[tasks.pipeline-check]
description = "Check the Field catalog, the crawler claims and the crawler-* tasks; print the catalog"
run = "python -m uszipcode.data check"

[tasks.pipeline-test]
description = "Run the offline tests of the data pipeline"
run = "python -m pytest tests/data -q"

[tasks.crawl-all]
description = "Run every crawler, one after another"
run = "python -m uszipcode.data crawl --all"

[tasks.pipeline-build]
description = "Join the crawler outputs onto a PK set (default: demo) and write the database"
run = "python -m uszipcode.data build"

# ---- one task per crawler -------------------------------------------------------------------------
[tasks.crawler-zip-basics]
description = "HUD-USPS crosswalk, Census Gazetteer, ZBP, uszipcode 2.x, BTS time zones -> ZIP type, city, state, county, point, area, time zone"
run = "python -m uszipcode.data crawl zip-basics"

[tasks.crawler-census-dhc]
description = "2020 Census DHC -> population, housing units and 10 distributions"
run = "python -m uszipcode.data crawl census-dhc"

[tasks.crawler-census-acs5]
description = "ACS 5-year, latest vintage -> medians, poverty rate and 11 distributions"
run = "python -m uszipcode.data crawl census-acs5"

[tasks.crawler-irs-soi]
description = "IRS SOI ZIP Code Data, latest tax year -> shares and averages of 11 income sources"
run = "python -m uszipcode.data crawl irs-soi"

[tasks.crawler-census-acs5-history]
description = "ACS 5-year 2011-2024 -> history: population, median income, home value and rent by year"
run = "python -m uszipcode.data crawl census-acs5-history"

[tasks.crawler-census-decennial]
description = "Census 2000, 2010 and 2020 -> history: population by census year"
run = "python -m uszipcode.data crawl census-decennial"

[tasks.crawler-irs-soi-history]
description = "IRS SOI ZIP Code Data 2011-2023 -> history: tax returns, their people and average income by year"
run = "python -m uszipcode.data crawl irs-soi-history"

[tasks.crawler-zcta-geometry]
description = "Census TIGER/Line and cartographic ZCTA boundaries -> bounding box, polygon"
run = "python -m uszipcode.data crawl zcta-geometry"
